name: ci

on:
  push:
    branches: [main]
  pull_request:

# Scaffold-stage CI: install, lint, typecheck, test.
# Portability-proof job is deliberately OFF until step 4 lands — leave the
# comment as a reminder of the intended target (`make portability-proof`).
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test

