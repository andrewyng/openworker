[project]
name = "agpack"
version = "0.0.0"
description = "Portable, verifiable agent runtime with a secure WASM tool sandbox."
readme = "README.md"
requires-python = ">=3.11"
# Intentionally minimal until implementation starts. Expected deps (uncomment as the stubs get fleshed out):
# dependencies = [
#     "pydantic>=2",        # bundle schema + policy model validation
#     "cryptography>=42",   # Ed25519 / ECDSA signing of bundle manifests
#     "wasmtime>=2",        # primary WASM driver (step 4 adds a second driver)
#     "opentelemetry-api",  # audit ledger shape (OTel span-ish records)
#     "typer",              # CLI
# ]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
# wasmer = ["wasmer"]   # second driver for the portability proof

[project.scripts]
# CLI entrypoint — agpack/cli.py defines the four verbs:
#   agpack bundle     pack an agent dir into a signed, versioned bundle
#   agpack run        validate + load a bundle, dispatch tool calls in the sandbox
#   agpack verify     verify signatures, policy, and provenance without executing
#   agpack audit      replay the execution ledger for a bundle run
agpack = "agpack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
