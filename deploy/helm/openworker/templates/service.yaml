apiVersion: v1
kind: Service
metadata:
  name: {{ include "ow.name" . }}
  labels:
    {{- include "ow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: https
      port: 443
      targetPort: https
