{{- if .Values.network.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ow.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "ow.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.network.clientNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {}
        {{- range .Values.network.serviceNamespaces }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 8443}, {protocol: TCP, port: 8080}]
    {{- with .Values.network.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
