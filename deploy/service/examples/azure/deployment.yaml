# Replace the subscription UUID. The setup profile must match it and this region.
apiVersion: ows/v1alpha1
name: azure-agents
cloud:
  provider: azure
  subscriptionId: "11111111-2222-4333-8444-555555555555"
  region: westus2
nodes:
  count: 2
  instanceType: Standard_D4as_v7
# Disposable six-hour trial. Expiry deletes workload data; keep no valuable data here.
trial:
  expiresAfterHours: 6
  deleteData: true
# Planning limit, not a hard billing cap. Set cloud billing alerts separately.
budget:
  limitUSD: 100
managementUI:
  enabled: true
  publicOrigin: https://localhost:8444
observability:
  enabled: true
  retentionDays: 14
# Export this variable in your shell; never put a key in this file.
models:
  anthropic: {env: ANTHROPIC_API_KEY}
# This is an OpenWorker settings file, separate from your cloud CLI login.
advanced:
  setupProfile: ./setup.json
