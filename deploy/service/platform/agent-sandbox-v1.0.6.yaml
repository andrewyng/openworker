---
kind: Namespace
apiVersion: v1
metadata:
  name: agent-sandbox-system

---

kind: ServiceAccount
apiVersion: v1
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controller

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-controller
subjects:
- kind: ServiceAccount
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
roleRef:
  kind: ClusterRole
  name: agent-sandbox-controller
  apiGroup: rbac.authorization.k8s.io

---

kind: Service
apiVersion: v1
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controller
spec:
  selector:
    app: agent-sandbox-controller
  ports:
  - name: metrics
    port: 8080   # Change to 8443 when --metrics-secure-serving is enabled.
    targetPort: metrics
    protocol: TCP

---

kind: Deployment
apiVersion: apps/v1
metadata:
  name: agent-sandbox-controller
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox-controller
  template:
    metadata:
      labels:
        app: agent-sandbox-controller
    spec:
      serviceAccountName: agent-sandbox-controller
      containers:
      - name: agent-sandbox-controller
        image: registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.6
        args:
        - --leader-elect=true
        # Uncomment to serve metrics over HTTPS with a TLS profile.
        # When enabling, also change the Service port and containerPort
        # from 8080 to 8443.
        # - --metrics-secure-serving
        # - --metrics-bind-address=:8443
        # - --metrics-cert-dir=/etc/metrics-certs
        # - --tls-min-version=VersionTLS12
        # - --tls-cipher-suites=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        ports:
        - name: metrics
          containerPort: 8080   # Change to 8443 when --metrics-secure-serving is enabled.
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        # Uncomment when --metrics-secure-serving is enabled:
        # volumeMounts:
        # - name: metrics-certs
        #   mountPath: /etc/metrics-certs
        #   readOnly: true
      # volumes:
      # - name: metrics-certs
      #   secret:
      #     secretName: agent-sandbox-metrics-tls

