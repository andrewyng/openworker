{{- if and .Values.evalWorker.enabled (hasKey .Values.config "observability") (not .Values.config.recovery_read_only) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-eval-worker
  labels:
    openworker.io/service-id: {{ .Values.config.service.id | quote }}
    app.kubernetes.io/component: eval-worker
spec:
  replicas: {{ .Values.evalWorker.replicas }}
  revisionHistoryLimit: 2
  selector: {matchLabels: {app: {{ .Release.Name }}-eval-worker}}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-eval-worker
        openworker.io/service-id: {{ .Values.config.service.id | quote }}
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {fsGroup: 1000}
      containers:
        - name: scorer
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /opt/openworker/entrypoint.sh]
          args: [eval-worker, --health-listen, "127.0.0.1:8082"]
          readinessProbe:
            exec: {command: [curl, --silent, --fail, --max-time, "2", "http://127.0.0.1:8082/readyz"]}
            timeoutSeconds: 3
          securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {{ .Values.evalWorker.resources | toYaml | nindent 12 }}
          volumeMounts:
            - {name: service, mountPath: /run/service/database-url, subPath: database-url, readOnly: true}
            - {name: service, mountPath: /run/service/pg-ca.crt, subPath: pg-ca.crt, readOnly: true}
            - {name: service, mountPath: /run/service/config.json, subPath: config.json, readOnly: true}
      volumes:
        - name: service
          projected:
            defaultMode: 0440
            sources:
              - configMap: {name: {{ .Release.Name }}-config, items: [{key: config.json, path: config.json}]}
              - secret: {name: {{ .Values.secrets.database }}, items: [{key: database-url, path: database-url}, {key: pg-ca.crt, path: pg-ca.crt}]}
{{- end }}
