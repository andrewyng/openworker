# Token prices in USD per MILLION tokens, keyed by the OpenWorker model id (provider:model).
#
# Fields: input, output, cache_read, cache_write. cache_write is the 5-minute cache write
# price; OpenWorker's usage does not distinguish 5-minute from 1-hour cache writes, so
# the cheaper rate is assumed. A model with no entry gets cost = null in summary.json and
# in the trajectory; token counts are always recorded.
#
# This table is a cross-check for a run's own record. Re-check every row against the
# vendor's page before relying on it, and update the date in its source line.
models:
  "anthropic:claude-sonnet-5":
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
    source: "https://claude.com/pricing (checked 2026-09-06)"
  "anthropic:claude-opus-5":
