  finding_without_evidence:
    title: "A finding has no evidence step"
    severity: warn
    scope: task
    input: "the task's journal findings, each with its severity and evidence links"
    applies: "a task with findings"
    fires: "A finding of severity critical or high has no evidence link to a recorded step."
    points_at: "the finding (journal_append) step"
    params:
      severities: [critical, high]
    says: "Finding #{finding} ({severity}) has no evidence step."
    fine: "Every high finding has an evidence step"
    needs: []
    golden: [S3-42]
    source: "across-features.md OB-16"

  self_verified:
    title: "A fix was verified by its own author"
    severity: warn
    scope: task
    input: "the board's verifies links and item_assigned and item_transitioned events"
    applies: "a fix item that another item verifies"
    fires: "The item that verifies a fix was done by the same worker that did the fix."
    points_at: "the verifying item's hand-off step"
    params: {}
    says: "The fix for #{item} was verified by the worker that made it."
    fine: "No fix was verified by its own author"
    needs: []
    golden: [S3-42, S3-44]
