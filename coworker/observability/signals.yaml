  scanner_failed:
    title: "A scanner failed"
    severity: warn
    scope: task
    input: "every turn of the task"
    applies: "a task with at least one scan step"
    fires: "A scan step exited non-zero with a code that is not in its scanner's `findings_exit` list."
    points_at: "the failed scan step"
    params: {}
    says: "{scanner} failed with exit code {exit_code}."
    fine: "No scanner failed"
    needs: [tool.scanner]
    golden: [S3-41, S3-44]
