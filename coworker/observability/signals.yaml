  # -- 0.6: Phase 3. Automations (OB-18). ------------------------------------------------------

  failed_in_a_row:
    title: "Failed runs in a row"
    severity: warn
    scope: series
    input: "one automation's runs in start order, each with its health (TD3-21)"
    applies: "an automation with at least `min_run` runs that were not skipped"
    fires: >-
      The last `min_run` runs that were not skipped all failed. A run failed when its run
      record says error; or its own turn (turn.automation) ended error, unknown or
      max_iterations_exceeded; or a warning of `tool_failed` (not recovered), `model_failed`
      or `sandbox_failed` fired on that turn; or it still says running 10 minutes after its
      turn ended.
    points_at: "the first step of the last failed run's turn"
    params:
      min_run: 3
      stuck_after_ms: 600000
    says: "Failed {count} runs in a row. Last error: {last_error}"
    fine: "The last runs did not all fail"
    needs: [turn.automation]
    golden: [S3-60, S3-61, S3-61b, S3-62]
    source: "across-features.md OB-18"

# -- 0.6: how a scan is recognised (OB-16, TD3-16; not installed: 0.7). -----------------------
# The engine sets a run_shell step's `scanner` from the command, by this rule only:
#   1. split the command into parts at &&, ||, ; and |;
#   2. in each part, drop `lead_ins` and any NAME=value words at the start, and a leading
#      python -m (or python3 -m, py -m); compare the last path piece of the next word, without
#      .exe, case-insensitively;
#   3. the first part whose word is a scanner's `word` (and `then`, when given) names it;
#   4. `action` is `version` when one of the next two words is in `probe_words`, else `scan`.
# So `grep -r semgrep docs` is not a scan, and `semgrep --version` is a probe.
# `findings_exit`: exit codes that mean "found something", not a failure.
scanners:
  # the words an area is shown with in issue texts (M3-R11)
  area_words: {code: code, secrets: secret, deps: dependency, iac: infrastructure}
  lead_ins: [sudo, npx, uvx, pipx, run, exec, env, time]
  probe_words: ["--version", version, "-v", "--help"]
  # 0.7: a scanner that is not installed did not scan (P3B-1). PowerShell exits 1 for a command
  # it does not know, the same code most scanners use for "found something", so the exit code
  # alone cannot tell them apart. When recording a run_shell step whose command names a scanner,
  # the engine records `scanner: null` (no scan ran) when:
  #   - the command exited with one of `exit` (127: sh "command not found"; 9009: cmd.exe), or
  #   - a line of its output (or error) names the scanner's `word`, or the word with _ for -
  #     (as python -m prints it), and holds one of `phrases`; both case-insensitive.
  # The checks then read it as a scan that never ran: scan_missing fires, and scanner_failed and
  # the coverage list do not count it. "No such file or directory" is left out on purpose: a real
  # scan of a missing folder can print it.
  not_found:
    exit: [127, 9009]
    phrases: ["is not recognized as", "command not found", ": not found", "commandnotfoundexception",
              "no module named", "could not determine executable to run"]
  list:
    semgrep: {word: semgrep, area: code, findings_exit: [1]}
    gitleaks: {word: gitleaks, area: secrets, findings_exit: [1]}
    osv-scanner: {word: osv-scanner, area: deps, findings_exit: [1]}
    npm-audit: {word: npm, then: audit, area: deps, findings_exit: [1]}
    pip-audit: {word: pip-audit, area: deps, findings_exit: [1]}
    trivy: {word: trivy, area: deps, findings_exit: []}
    checkov: {word: checkov, area: iac, findings_exit: [1]}
