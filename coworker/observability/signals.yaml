  no_findings_without_scan:
    title: "\"No findings\" without a scan"
    severity: warn
    scope: task
    input: "every turn of the task, and its coverage report ({area: {ran, findings}})"
    applies: "a task whose hand-off carries a coverage report"
    fires: "The coverage report says an area ran with 0 findings, but the task has no successful scan of that area."
    points_at: "the hand-off step"
    params: {}
    says: "The report says no {area_word} problems were found, but no {area_word} scan ran. It should say we could not look, not that nothing is there."
    fine: "Every \"no findings\" has a scan behind it"
    needs: [tool.scanner]
