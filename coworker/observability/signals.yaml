  # -- 0.6: Phase 3. Security coverage (OB-16). ------------------------------------------------
  # These run on tasks of coworkers whose manifest declares `coverage` (stamp.persona_coverage,
  # TD3-24). A scan is a tool step whose `scanner.action` is `scan` (the `scanners` list, below).

  scan_missing:
    title: "A promised scan did not run"
    severity: warn
    scope: task
    input: "every turn of the task, with stamp.persona_coverage"
    applies: "a task of a coworker that declares coverage"
    fires: >-
      An area in `persona_coverage` has no successful scan step in the task. A scan is
      successful when it exits 0, or with one of its scanner's `findings_exit` codes.
    points_at: "the hand-off step (the transition to review), else the task's last step"
    params: {}
    says: "{scanner_for_area} did not run: {area_word} scan skipped."
    fine: "Every promised scan ran ({areas})"
    needs: [tool.scanner, stamp.persona_coverage]
    golden: [S3-40, S3-41, S3-44]
