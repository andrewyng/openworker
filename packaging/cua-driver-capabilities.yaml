version: 3
expires_after: 8h
idle_timeout: 30m

# Bootstrap profile reference. At runtime OpenWorker writes an equivalent short-lived
# manifest under the user's state directory, adding exact PIDs and window IDs for the
# applications selected in Settings > Computer use. The signed application bundle is
# never modified. No shell, filesystem, browser-profile, process-control, or desktop-wide
# screenshot/input tools are admitted.
resources:
  apps: []
  desktop:
    display: true
    applications: []
    windows: []

allow:
  tools:
    - list_windows
    - get_window_state
    - click
    - type_text
    - press_key
