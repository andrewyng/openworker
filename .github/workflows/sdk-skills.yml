name: SDK skills

on:
  pull_request:
    paths: ["skills/**", "harness/release/**", ".github/workflows/sdk-skills.yml"]
  push:
    branches: [main]
    paths: ["skills/**", "harness/release/**", ".github/workflows/sdk-skills.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No Rust build, Docker daemon, cloud credentials or model calls required.
      - name: Test SDK compatibility and standalone skill installation
        run: node --test skills/install.test.mjs skills/package.test.mjs harness/release/contract.test.mjs
      - name: Compile skill examples against the SDK
        run: |
          npm --prefix harness/typescript-sdk ci
          npm --prefix harness/typescript-sdk run build
          node --test skills/snippets.test.mjs
