# Automatically follow andrewyng/openworker releases into the Chinese i18n branch.
#
# When a new upstream vX.Y.Z tag appears (or on manual dispatch), this workflow:
#   1. merges that tag into i18n-simplified-chinese
#   2. re-applies this fork's updater endpoint + pubkey
#   3. bumps tauri.conf.json to {upstream}-zh.N
#   4. pushes a v{upstream}-zh.N tag → triggers the Release workflow
#
# On merge conflicts it opens a GitHub Issue instead of force-pushing.
#
# Required:
#   - repo Issues enabled (Settings → General → Features → Issues)
#   - workflow permissions: contents write, issues write (Settings → Actions)

name: Sync upstream

on:
  schedule:
    # 08:00 UTC daily ≈ 16:00 CST
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync (empty = latest vX.Y.Z)"
        required: false
        type: string
      force:
        description: "Cut a new zh.N build even if this upstream base is already synced"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n-simplified-chinese
          fetch-depth: 0
          # Push tags with the default GITHUB_TOKEN.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream → i18n branch
        id: sync
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          CREATE_TAG: "1"
        run: |
          set -euo pipefail
          chmod +x packaging/sync_upstream.sh
          set +e
          if [ -n "${{ inputs.tag }}" ]; then
            packaging/sync_upstream.sh "${{ inputs.tag }}" > /tmp/sync.log 2>&1
          else
            packaging/sync_upstream.sh > /tmp/sync.log 2>&1
          fi
          code=$?
          set -e
          cat /tmp/sync.log
          if [ $code -eq 0 ]; then
            if grep -q '^already up to date' /tmp/sync.log; then
              echo "status=skipped" >> "$GITHUB_OUTPUT"
            else
              echo "status=ok" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if grep -qi 'merge conflict' /tmp/sync.log; then
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code

      - name: Open issue on merge conflict
        if: steps.sync.outputs.status == 'conflict'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = `上游同步冲突：需要人工处理 (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              '自动跟版（Sync upstream）在合并 `andrewyng/openworker` 时发生冲突。',
              '',
              '请本地处理：',
              '```bash',
              'git fetch upstream --tags',
              'git checkout i18n-simplified-chinese',
              'packaging/sync_upstream.sh   # 或传入具体 tag',
              '# 解决冲突后：',
              'python3 packaging/apply_fork_updater.py --version <X.Y.Z-zh.N>',
              'git add -A && git commit',
              'CREATE_TAG=1 packaging/sync_upstream.sh <tag>',
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Fail on conflict
        if: steps.sync.outputs.status == 'conflict'
        run: |
          echo "::error::upstream merge conflict — see the issue (if Issues are enabled) or the sync log above"
          exit 1
