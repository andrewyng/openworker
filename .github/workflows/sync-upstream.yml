name: Detect upstream release

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

# Deliberately inert until the default-branch bootstrap and explicit opt-in.
jobs:
  integrate:
    if: github.repository == 'Pol-Lanski/openworker' && vars.NEXUS_UPSTREAM_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: nexus-upstream-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nexus-provider
          fetch-depth: 0
          # Use the same credential for Git pushes and API calls. Updating upstream
          # workflow files may require the token's Workflows write permission.
          token: ${{ secrets.NEXUS_SYNC_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open or update upstream integration PR and dispatch CI
        env:
          GH_TOKEN: ${{ secrets.NEXUS_SYNC_TOKEN || github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 packaging/sync_upstream_release.py
