[package]
readme = "README.md"
repository = "https://github.com/andrewyng/openworker"
description = "OpenWorker security-adapters for durable agent applications"
publish = ["crates-io"]
name = "openworker-security-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
openworker-guardrails = { version = "=0.1.0-beta.1", path = "../guardrails", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }
tokio-util = "0.7"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
