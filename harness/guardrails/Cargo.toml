[package]
readme = "README.md"
repository = "https://github.com/andrewyng/openworker"
description = "OpenWorker guardrails for durable agent applications"
publish = ["crates-io"]
name = "openworker-guardrails"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["engine"]
engine = ["dep:regex", "dep:futures-util", "dep:tokio"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
regex = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["time", "macros", "rt"], optional = true }
