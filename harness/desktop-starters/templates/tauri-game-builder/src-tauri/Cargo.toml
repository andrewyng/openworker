[package]
name = "arcade"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
openworker-sdk = { path = "__SDK_PATH__" }
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
futures-util = "0.3"
anyhow = "1"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
