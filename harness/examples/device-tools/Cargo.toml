[package]
publish = false
name = "device-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
[dependencies]
openworker-tools = { path = "../../tools-sdk" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
