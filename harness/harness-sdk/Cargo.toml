[package]
readme = "README.md"
repository = "https://github.com/andrewyng/openworker"
description = "OpenWorker sdk for durable agent applications"
name = "openworker-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]

[features]
default = ["guardrails", "compliance"]
guardrails = ["openworker-runtime/guardrails", "openworker-store-postgres/guardrails"]
compliance = ["openworker-runtime/compliance", "openworker-store-postgres/compliance"]
test-support = []
compliance-export = ["compliance", "openworker-runtime/compliance-export"]
security-adapters = ["guardrails", "dep:openworker-security-adapters"]

[[bin]]
name = "openworker-harness"
path = "src/main.rs"

[dependencies]
openworker-security-adapters = { version = "=0.1.0-beta.2", path = "../security-adapters", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
openworker-store-postgres = { version = "=0.1.0-beta.2", path = "../store-postgres" }
openworker-runtime = { version = "=0.1.0-beta.2", path = "../runtime", default-features = false }
openworker-telemetry = { version = "=0.1.0-beta.2", path = "../telemetry", features = ["otlp"] }
openworker-tools = { version = "=0.1.0-beta.2", path = "../tools-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
zeroize = "1"
futures-util = "0.3"
async-stream = "0.3"

[dev-dependencies]
tempfile = "3"
postgres = "0.19"

[[bin]]
name = "sdk-test-host"
path = "tests/support/host.rs"
required-features = ["test-support"]
