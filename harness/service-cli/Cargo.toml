[package]
name = "openworker-service-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[[bin]]
name = "ows"
path = "src/main.rs"
[dependencies]
openworker-sdk = { path = "../harness-sdk" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
zeroize = "1"
[dev-dependencies]
tempfile = "3"
