[package]
readme = "README.md"
repository = "https://github.com/andrewyng/openworker"
description = "OpenWorker store-postgres for durable agent applications"
name = "openworker-store-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]

[features]
attachments = ["openworker-runtime/attachments"]
compliance = ["openworker-runtime/compliance"]
guardrails = ["openworker-runtime/guardrails"]
test-support = ["dep:openworker-tools", "openworker-runtime/test-fixtures"]
openshell-test = []

[[bin]]
name = "pg-worker-fixture"
path = "tests/support/worker.rs"
required-features = ["test-support"]

[[bin]]
name = "pg-recovery-fixture"
path = "tests/support/recovery.rs"
required-features = ["test-support"]

[dependencies]
openworker-artifacts = { version = "=0.1.0-beta.3", path = "../artifacts" }
openworker-runtime = { version = "=0.1.0-beta.3", path = "../runtime", default-features = false }
openworker-tools = { version = "=0.1.0-beta.3", path = "../tools-sdk", optional = true }
anyhow = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
rustls-pemfile = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
