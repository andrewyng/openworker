[package]
name = "openworker-store-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-support = ["dep:openworker-tools", "openworker-runtime/test-fixtures"]
openshell-test = []

[[bin]]
name = "pg-worker-fixture"
path = "tests/support/worker.rs"
required-features = ["test-support"]

[[bin]]
name = "pg-recovery-fixture"
path = "tests/support/recovery.rs"
required-features = ["test-support"]

[dependencies]
openworker-artifacts = { path = "../artifacts" }
openworker-runtime = { path = "../runtime" }
openworker-tools = { path = "../tools-sdk", optional = true }
anyhow = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
rustls-pemfile = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
