[package]
name = "openworker-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
readme = "README.md"
repository = "https://github.com/andrewyng/openworker"
description = "Optional bounded recording, trace queries and evaluation storage for OpenWorker"

[features]
default = []
evaluations = ["dep:openworker-compliance"]
postgres = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls", "dep:rustls-pemfile", "dep:zeroize"]
otlp = ["openworker-telemetry/otlp"]

[dependencies]
openworker-compliance = { path = "../compliance", version = "=0.1.0-beta.3", optional = true }
openworker-telemetry = { path = "../telemetry", version = "=0.1.0-beta.3" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-serde_json-1"], optional = true }
postgres-native-tls = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
rustls-pemfile = { version = "2", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }

[[example]]
name = "export_probe"
required-features = ["otlp"]
