[package]
name = "openworker-server-reference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
openshell-test = []
team-test = ["openworker-store-postgres/test-support", "dep:openworker-tools"]

[dependencies]
openworker-observability = { path = "../observability", features = ["postgres"] }
openworker-tools = { path = "../tools-sdk", optional = true }
openworker-artifacts = { path = "../artifacts", features = ["s3", "azure"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
openworker-telemetry = { path = "../telemetry", features = ["otlp"] }
openworker-runtime = { path = "../runtime" }
openworker-store-postgres = { path = "../store-postgres" }
anyhow = "1"
base64 = "0.22"
axum = "0.7"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json","stream","rustls-tls"] }

[dev-dependencies]
openworker-sdk = { path = "../harness-sdk" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
futures-util = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
