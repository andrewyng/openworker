[package]
name = "openworker-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
otlp = ["otel", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:reqwest", "dep:http", "dep:bytes", "dep:async-trait", "dep:prost", "dep:opentelemetry-proto", "dep:serde_json"]

[dependencies]
anyhow = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "trace", "metrics", "logs"], optional = true }
opentelemetry-http = { version = "=0.33.1", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
prost = { version = "=0.14.4", optional = true }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
axum = "0.7"
prost = "=0.14.4"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
